# ใส่ใน server { listen 443 ssl; ... }
location /mh/ {
    proxy_pass http://127.0.0.1:6300/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /mh;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # IP จริงใน audit log / จำกัด login ผิด
    proxy_read_timeout 120s;
}
