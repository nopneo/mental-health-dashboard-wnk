# ใส่ใน <VirtualHost *:443> "ก่อน" บรรทัด ProxyPass / ... ตัวอื่น (ถ้ามี)
# ต้องเปิดโมดูล proxy, proxy_http, headers
# mod_proxy เติม X-Forwarded-For ให้เอง (แอปใช้เป็น IP จริงใน audit log / จำกัด login ผิด)
ProxyPass /mh/ http://127.0.0.1:6300/
ProxyPassReverse /mh/ http://127.0.0.1:6300/
<Location /mh/>
    RequestHeader set X-Forwarded-Prefix /mh
    RequestHeader set X-Forwarded-Proto https
</Location>
