{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block body %}
<div class="login">
  <img src="{{ logo_url }}" alt="" class="login-logo">
  <h1>แดชบอร์ดงานสุขภาพจิต</h1>
  <p class="muted">{{ hospital }} และ รพ.สต. ในเครือข่าย</p>
  <form method="post" class="card login-card">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>ชื่อผู้ใช้<input name="username" autocomplete="username" required autofocus></label>
    <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn">เข้าสู่ระบบ</button>
  </form>
  <p class="muted small">ขอบัญชีผู้ใช้ได้ที่ {{ contact }}</p>
</div>
{% endblock %}
